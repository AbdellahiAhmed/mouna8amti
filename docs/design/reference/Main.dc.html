<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>منظمتي — تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A3D2F}
*{box-sizing:border-box}
a{color:#0E5A44;text-decoration:none}
a:hover{color:#0A3D2F}
.login{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 16px;background:#0A3D2F;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1B1D1A;font-size:16px;line-height:1.7}
.topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.topo path{fill:none;stroke:#FFFFFF;stroke-opacity:.075;stroke-width:1;vector-effect:non-scaling-stroke}
.col{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:14px}
.mk-t{fill:#FFFFFF}
.mk{fill:none;stroke:#0A3D2F;stroke-width:2.6;stroke-linecap:square;stroke-linejoin:miter}
.word{font-family:'Readex Pro',system-ui,sans-serif;font-size:30px;font-weight:600;color:#FFFFFF;line-height:1.2}
.card{width:100%;background:#FFFFFF;border-radius:20px;padding:40px 36px 36px;display:flex;flex-direction:column;gap:22px}
.h1{margin:0;font-family:'Readex Pro',system-ui,sans-serif;font-size:28px;font-weight:600;color:#0A3D2F;line-height:1.3}
.lead{margin:6px 0 0;font-size:16px;color:#6B675E}
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:15px;font-weight:500;color:#3D3F3A}
.box{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1px solid #DEDBD3;border-radius:12px;background:#FFFFFF;color:#6B675E}
.box:focus-within{border-color:#157A5C;box-shadow:0 0 0 3px #E6F2EC}
.box input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:#1B1D1A}
.box input::placeholder{color:#8A867D}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eye{width:40px;height:40px;margin-inline-end:-8px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:#6B675E;cursor:pointer}
.eye:hover{background:#F4F3EF;color:#1B1D1A}
.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;color:#3D3F3A;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:#0E5A44}
.forgot{font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:12px;background:#0E5A44;color:#FFFFFF;font-size:17px;font-weight:600}
.btn:hover{background:#0A3D2F;color:#FFFFFF}
.tag{font-size:16px;color:#FFFFFF;opacity:.74;text-align:center}
/* tailles compactes */
.login{font-size:15px}
.col{max-width:410px;gap:22px}
.word{font-size:26px}
.card{padding:32px 30px 28px;gap:18px}
.h1{font-size:24px}
.lead{font-size:15px}
.lbl{font-size:14px}
.box{height:48px}
.box input{font-size:15px}
.opts{font-size:14px}
.btn{height:50px;font-size:16px}
.tag{font-size:15px}
</style>
</helmet>
<div class="login" dir="rtl">
  <svg class="topo" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g transform="translate(1210 150)">
      <path transform="rotate(0) scale(0.35)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(7) scale(0.7)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(14) scale(1.05)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(21) scale(1.42)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(28) scale(1.8)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(35) scale(2.2)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(42) scale(2.62)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(49) scale(3.06)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(56) scale(3.52)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(63) scale(4.0)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(70) scale(4.5)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(77) scale(5.02)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
    </g>
    <g transform="translate(200 800)">
      <path transform="rotate(-10) scale(0.4)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-18) scale(0.78)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-26) scale(1.18)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-34) scale(1.6)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-42) scale(2.04)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-50) scale(2.5)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-58) scale(2.98)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-66) scale(3.48)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-74) scale(4.0)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
      <path transform="rotate(-82) scale(4.54)" d="M0-100C58-102 104-58 102-4C100 52 62 96 4 99C-56 102-104 60-103 2C-102-54-60-98 0-100Z"></path>
    </g>
  </svg>

  <div class="col">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 36 36" aria-hidden="true"><rect class="mk-t" width="36" height="36" rx="10"></rect><path class="mk" d="M8 26V10l5 7 5-7v16M18 10l7 16V10M21.5 10h7"></path></svg>
      <span class="word">منظمتي</span>
    </div>

    <form class="card" action="Dashboard.dc.html">
      <div>
        <h1 class="h1">تسجيل الدخول</h1>
        <p class="lead">مرحبًا بعودتك. أدخل بياناتك للمتابعة.</p>
      </div>

      <div class="field">
        <label class="lbl" for="email">البريد الإلكتروني</label>
        <div class="box">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 6.5 8.5 6 8.5-6"></path></svg>
          <input id="email" type="email" dir="ltr" style="text-align: right" placeholder="name@alamal.mr" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="pw">كلمة المرور</label>
        <div class="box">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path></svg>
          <input id="pw" type="{{pwType}}" placeholder="••••••••" autocomplete="current-password">
          <button class="eye" type="button" aria-label="{{eyeLabel}}" onClick="{{togglePw}}">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="opts">
        <label class="chk" for="rem"><input id="rem" type="checkbox"><span>تذكّرني</span></label>
        <a class="forgot" href="#">نسيت كلمة المرور؟</a>
      </div>

      <a class="btn" href="Dashboard.dc.html">دخول</a>
    </form>

    <p class="tag" style="margin: 0">منصة إدارة المنظمات والمشاريع الممولة</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false };
  }
  renderVals() {
    const show = this.state.show;
    return {
      pwType: show ? 'text' : 'password',
      eyeLabel: show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
      togglePw: () => this.setState({ show: !show })
    };
  }
}
</script>
</body>
</html>
